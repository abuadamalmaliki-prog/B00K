    if (img.dataset.n !== String(n)) { img.src = url; img.dataset.n = String(n); try { await img.decode(); } catch (e) {} }
    bar.style.width = (clamp((l - s.lead) / s.clipDur) * 100) + '%';
    let dp = 0; (s.cuts || []).forEach(c => { const d = Math.abs((l - s.lead) - c); dp = Math.max(dp, 1 - clamp(d / .16)); }); dip.style.opacity = dp;
    let cur = -1; phs.forEach((p, i) => { if (tau >= p.c.ts - .02) cur = i; }); if (cur < 0) cur = 0;
    phs.forEach((p, i) => {
      const vis = i === cur; p.ph.style.opacity = vis ? clamp((tau - p.c.ts + .12) / .18 + (i === 0 ? 1 : 0)) : 0;
      if (vis) { let last = -1; p.times.forEach((tt, k) => { if (tau >= tt) last = k; });
        p.spans.forEach((sp, k) => { sp.className = 'w' + (k < last ? ' on' : k === last ? ' on cur' : ''); }); }
    });
    root.style.opacity = fadeEnv(l, dur, .35, .35);
    root.style.transform = `translateY(${(1 - eOut(l / .6)) * 24}px)`;
  } };
}

function buildRebut(s) {
  const root = el('div', 'scene'); const cards = [], beats = [];
  root.appendChild(el('div', 'toprow', `<span class="pill gold"><span class="dot"></span>${esc(s.tag)}</span><span class="hd">${esc(P.handle)}</span>`));
  const cbox = el('div', 'r-cards'), bbox = el('div', 'r-beats'); root.append(cbox, bbox);
  (s.cards || []).forEach((c, ci) => {
    const w = el('div', 'paperw'); const p = el('div', 'paper' + (c.center ? ' center' : '')); p.style.clipPath = tornPolygon(11 + ci * 7 + s.id.length);
    p.innerHTML = `<div class="ar" lang="ar" dir="rtl">${c.ar.replace(/<m>/g, '<mark>').replace(/<\/m>/g, '</mark>')}</div><div class="src">${esc(c.src)}</div>`; w.appendChild(p); cbox.appendChild(w);
    w.style.top = (c.center ? 400 : 300) + 'px'; cards.push({ w, c, marks: [...p.querySelectorAll('mark')] });
  });
  (s.beats || []).forEach(b => {
    const has = (s.cards || []).some(c => b.t < c.t + c.d && b.t + b.d > c.t);
    const zone = s.big ? 'big' : (has ? 'bottom' : 'mid');
    const bt = buildBeat(b, zone); bbox.appendChild(bt.e); beats.push({ bt, b, hold: !!b.hold });
  });
  stageEl.appendChild(root);
  return { root, update(l, dur) {
    cards.forEach(({ w, c, marks }) => {
      const a = l - c.t, inn = eOut(a / .8), out = clamp((c.t + c.d - l) / .45);
      const vis = a > -.01 && l < c.t + c.d + .01; w.style.visibility = vis ? 'visible' : 'hidden';
      w.style.opacity = Math.min(inn, out); w.style.transform = `translateY(${(1 - inn) * 70 + (1 - out) * -30}px) rotate(${lerp(-1.6, 0, inn)}deg)`;
      marks.forEach((m, i) => m.style.setProperty('--p', (eInOut((l - (c.marks[i] ?? 9999)) / .9) * 100).toFixed(1) + '%'));
    });
    beats.forEach(({ bt, b, hold }) => updateBeat(bt, b, l, hold));
    root.style.opacity = fadeEnv(l, dur, .3, .4);
  } };
}

function buildOutro(s) {
  const root = el('div', 'scene'); const beats = [];
  const lg = el('div'); lg.id = 'outLogo'; ['logo_ring', 'logo_white', 'logo_gold'].forEach(n => { const a = el('div', 'a'); a.style.backgroundImage = `url(/assets/${n}.png)`; if (n === 'logo_ring') { const d = el('div', 'a'); d.style.cssText = 'border-radius:50%;background:#000;transform:scale(.93)'; lg.appendChild(d); } lg.appendChild(a); });
  root.appendChild(lg);
  (s.beats || []).forEach(b => { const bt = buildBeat(b, 'mid'); bt.e.style.top = '760px'; bt.e.style.fontSize = '72px'; root.appendChild(bt.e); beats.push({ bt, b }); });
  const rf = el('div', 'refs'); const refs = s.refs.map(r => { const d = el('div', 'ref', r.replace(/^([^·]+)·/, '<b>$1</b>·')); rf.appendChild(d); return d; });
  root.appendChild(rf);
  const oh = el('div'); oh.id = 'outHandle'; oh.textContent = P.handle; root.appendChild(oh);
  stageEl.appendChild(root);
  return { root, update(l, dur) {
    const lp = eOut(l / 1.0); lg.style.opacity = lp; lg.style.transform = `scale(${.86 + .14 * lp})`;
    beats.forEach(({ bt, b }) => updateBeat(bt, b, l, false));
    // refs after beats
    refs.forEach((r, i) => { const p = eOut((l - (6.2 + i * .28)) / .5); r.style.opacity = p; r.style.transform = `translateY(${(1 - p) * 14}px)`; });
    const hp = eOut((l - 7.6) / .8); oh.style.opacity = hp; oh.style.transform = `translateY(${(1 - hp) * 16}px)`;
    root.style.opacity = Math.min(clamp(l / .4), clamp((dur - l) / .8));
  } };
}

/* ------------------------------------------------------------ API */
window.setup = async () => {
  P = await (await fetch('/work/timeline.json')).json();
  await Promise.all(['500 30px Inter', '600 30px Inter', '700 30px Inter', '800 30px Inter', '400 40px Amiri', '700 40px Amiri'].map(f => document.fonts.load(f, 'العربية Abc')));
  await document.fonts.ready;
  const wm = (id, src) => { document.getElementById(id).style.backgroundImage = `url(${src})`; };
  wm('wmW', '/assets/logo_white.png'); wm('wmG', '/assets/logo_gold.png');
  let start = 0;
  for (const s of P.scenes) {
    s.start = start; start += s.dur;
    const b = { intro: buildIntro, title: buildTitle, quote: buildQuote, rebut: buildRebut, outro: buildOutro }[s.type](s);
    scenes.push({ s, ...b });
  }
  total = start; return { total, fps: P.fps };
};

window.frame = async t => {
  let gold = 0, red = 0, intro = 0; let cur = null;
  for (const sc of scenes) {
    const l = t - sc.s.start, on = l >= -0.001 && l < sc.s.dur + .001; sc.root.style.visibility = on ? 'visible' : 'hidden';
    if (!on) continue; cur = sc;
    await sc.update(Math.max(0, l), sc.s.dur);
    const env = clamp(Math.min(l / .5, (sc.s.dur - l) / .5));
    if (sc.s.type === 'intro') intro = env; else if (sc.s.type === 'quote' && sc.s.who === 'critic') red = env; else gold = env;
  }
  // moods blend a bit beyond the scene edges so cuts feel continuous
  drawBG(t, Math.max(gold, .35), red, intro);
  const wmO = cur && cur.s.type !== 'intro' ? .055 : 0; const wmEl = document.getElementById('wm'); wmEl.style.opacity = wmO;
  document.getElementById('wmW').style.transform = `rotate(${Math.sin(t * .12) * 4}deg) scale(${1 + Math.sin(t * .2) * .03})`;
  document.getElementById('wmG').style.transform = `rotate(${Math.sin(t * .12) * 4}deg) scale(${1 + Math.sin(t * .2) * .03})`;
  document.getElementById('grain').style.backgroundPosition = `${(t * 137) % 256}px ${(t * 71) % 256}px`;
  document.getElementById('progress').style.width = (clamp(t / total) * 100) + '%';
};
window.__ready = true;
</script>
