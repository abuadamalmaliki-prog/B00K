name: Deploy Khizana library to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['library/site/**', '.github/workflows/library-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: library/site
      - id: deployment
        uses: actions/deploy-pages@v4
