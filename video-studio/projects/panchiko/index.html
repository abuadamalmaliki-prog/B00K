<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Found — a Panchiko short</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@500&display=block">
<script src="../../studio.js"></script>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<style>
  #stage { background: #000; }
  canvas { position: absolute; inset: 0; }
  /* Location card: a quiet lower-left caption, like the first frame of a film. */
  .card { position: absolute; left: 64px; bottom: 150px; opacity: 0; color: #f1ede4;
    font: 500 34px/1.2 'Inter', sans-serif; letter-spacing: .08em; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .wm { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px;
    background: rgba(7,8,12,.35); border: 1px solid rgba(255,255,255,.18); white-space: pre;
    font: 400 20px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; color: #fff; }
  .wm b { font-weight: 400; color: #BFE3FF; }
</style>
</head>
<body>
<div id="stage">
  <div class="card" id="card"></div>
  <div class="wm"><b>Instagram:</b> ihvyone_1   ·   <b>Tiktok:</b> rapidfirequestion</div>
</div>
<script type="module">
  import * as THREE from 'three';
  import copy from './src/copy.js';
  import sync from './src/sync.js';
  import { applyCamera, cameraAt, doorAt, gradeAt, bodyPoseAt, useSync, footfalls, CUE, VFOV } from './src/camera.js';
  import { createStore } from './src/store.js';
  import { createBody } from './src/body.js';
  import { createLook } from './src/look.js';
  import { createRenderer } from './src/eng.js';

  const W = 1080, H = 1350;
  Studio.setup({
    width: W, height: H, fps: 60, duration: sync.WINDOW.duration,
    audio: [{ src: 'media/song.mp4', from: sync.WINDOW.start, duration: sync.WINDOW.duration, fadeIn: 0.02 }],
  });
  useSync(sync);

  const renderer = createRenderer(W, H);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06080d);
  scene.fog = new THREE.FogExp2(0x1a1e26, 0.026);
  const camera = new THREE.PerspectiveCamera(VFOV, W / H, 0.03, 80);

  // Loading is registered with Studio.wait and every frame awaits it, so rendering never
  // starts on a half-built world.
  const ready = Studio.wait(Promise.all([
    createStore({ renderer }), createBody({ renderer }), createBody({ renderer }),
  ]).then(([store, body, worker]) => {
    scene.add(store.root, body.root, worker.root);
    scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x20242a, 0.25));
    // The same CC0 rig dresses the shop assistant.
    worker.hideHead(false); worker.outfit.jacket.set(0x1f3b2d); worker.outfit.jeans.set(0x17181b);
    window.__film = { store, body, worker, camera, scene };            // for debugging from render scripts
    return { store, body, worker };
  }));

  // People are driven like the viewer: an eye position plus where they look.
  const eyeOf = (x, y, z) => { const c = new THREE.PerspectiveCamera(); c.position.set(x, y, z); return c; };
  const workerEye = eyeOf(-3.02, 1.62, -2.05);
  const COUNTER_WORK = new THREE.Vector3(-2.55, 1.08, -2.1), DOORWAY = new THREE.Vector3(0.1, 1.5, 0);
  function peopleAt(t, worker) {
    // The assistant sorts a case at the till; the door's bell makes them look up, then back down.
    const look = Studio.progress(t, CUE.release, CUE.release + 0.5) * (1 - Studio.progress(t, CUE.release + 1.9, CUE.release + 2.5));
    const target = COUNTER_WORK.clone().lerp(DOORWAY, Studio.ease.inOut(look));
    target.x += 0.02 * Math.sin(t * 1.3); target.y += 0.015 * Math.sin(t * 0.9 + 1);
    workerEye.lookAt(target);
    worker.update(t, { cam: workerEye, walk: 0, step: 0, holdCase: 1 - 0.6 * look, caseAt: new THREE.Vector3(-2.67, 1.16, -2.08), env: 'shop' });
  }

  // Handheld phone: small unsteady hand + a jolt through the camera on every heel strike.
  const shake = new THREE.Quaternion(), shakeE = new THREE.Euler(0, 0, 0, 'YXZ');
  function handheld(t) {
    const n = (f, ph) => Math.sin(2 * Math.PI * f * t + ph);
    let yaw = 0.0035 * n(1.7, 0.3) + 0.0022 * n(3.1, 1.2) + 0.0012 * n(6.3, 2.1);
    let pitch = 0.003 * n(1.3, 0.9) + 0.002 * n(2.9, 2.4) + 0.001 * n(7.1, 0.5);
    let roll = 0.004 * n(0.9, 1.7) + 0.002 * n(2.3, 0.2);
    let drop = 0;
    for (const f of footfalls) {
      const dt = t - f.t;
      if (dt < 0 || dt > 0.45) continue;
      const j = f.weight * Math.exp(-dt * 12) * Math.sin(Math.min(1, dt * 30) * Math.PI * 0.5);
      drop += j; pitch += 0.014 * j; roll += (f.side === 'L' ? -1 : 1) * 0.007 * j;
    }
    camera.position.y -= 0.02 * drop;
    shake.setFromEuler(shakeE.set(pitch, yaw, roll));
    camera.quaternion.multiply(shake);
    camera.updateMatrixWorld();
  }

  // How much the camera moves (for the phone's motion smear).
  function motionAt(t) {
    const a = cameraAt(t), b = cameraAt(t + 1 / 60);
    const turn = (Math.abs(Math.atan2(Math.sin(b.yaw - a.yaw), Math.cos(b.yaw - a.yaw))) + Math.abs(b.pitch - a.pitch)) * 60;
    return Math.min(1.5, turn * 0.6 + (a.speed || 0) * 0.35);
  }
  const look = createLook(renderer, W, H);

  const card = document.getElementById('card');
  card.textContent = copy.cards.opening.text;

  async function frame(t) {
    const { store, body, worker } = await ready;
    applyCamera(camera, t);
    store.update(t, { door: doorAt(t), flicker: sync.pulse(t, sync.fillHits, 0.06) });
    body.update(t, { cam: camera, ...bodyPoseAt(t) });
    peopleAt(t, worker);
    handheld(t);

    // "Nottingham · 2016" rises in after the first bar and leaves before the door.
    card.style.opacity = String(Studio.progress(t, 0.6, 1.3) * (1 - Studio.progress(t, 3.2, 3.8)));

    // Phone auto-exposure: lifts the dark street, over-exposes stepping into the light, then settles.
    const g = gradeAt(t);
    const exposure = (1 + (g.exposure - 1) * 2.2) * (1 + 0.35 * g.grade.street);
    look.render(scene, camera, { ...g, exposure, motion: motionAt(t) }, t);
  }

  Studio.onFrame(async (t) => {
    // The smear needs the previous frames: after a jump (a new chunk, a still), render them first.
    if (!look.continuous(t)) for (const back of [2, 1]) if (t - back / 60 >= 0) await frame(t - back / 60);
    await frame(t);
  });
</script>
</body>
</html>
