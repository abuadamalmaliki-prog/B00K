<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REZE — Bomb Devil Edit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --reze-pink: #ff3366;
  --reze-gold: #ffaa33;
  --reze-dark: #0a0008;
  --reze-glow: #ff66aa;
  --fuse-orange: #ff6600;
  --explosion-yellow: #ffdd00;
  --spark-white: #fffaee;
  --text-primary: #f0e6f6;
  --text-dim: #8877aa;
  --panel-bg: rgba(10, 0, 8, 0.85);
  --panel-border: rgba(255, 51, 102, 0.3);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--reze-dark);
  color: var(--text-primary);
  font-family: 'Rajdhani', sans-serif;
}

#webgl-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

/* ── Overlay UI ── */
#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}

#overlay > * { pointer-events: auto; }

/* ── Title Card ── */
#title-card {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 100;
  cursor: pointer;
  transition: opacity 0.8s ease, transform 0.8s ease;
}

#title-card.hidden {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.8);
  pointer-events: none;
}

#title-card h1 {
  font-family: 'Orbitron', monospace;
  font-size: clamp(3rem, 8vw, 7rem);
  font-weight: 900;
  color: var(--reze-pink);
  text-shadow:
    0 0 20px var(--reze-pink),
    0 0 60px rgba(255, 51, 102, 0.5),
    0 0 120px rgba(255, 51, 102, 0.2);
  letter-spacing: 0.3em;
  animation: titlePulse 2s ease-in-out infinite;
}

#title-card .subtitle {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(0.9rem, 2vw, 1.4rem);
  color: var(--reze-gold);
  letter-spacing: 0.5em;
  margin-top: 1rem;
  text-transform: uppercase;
  opacity: 0.8;
}

#title-card .arabic-subtitle {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: clamp(1rem, 2.5vw, 1.6rem);
  color: var(--reze-glow);
  margin-top: 0.8rem;
  direction: rtl;
  opacity: 0.7;
}

#title-card .start-hint {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-top: 2rem;
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 20px var(--reze-pink), 0 0 60px rgba(255,51,102,0.5); }
  50% { text-shadow: 0 0 40px var(--reze-pink), 0 0 100px rgba(255,51,102,0.7), 0 0 160px rgba(255,51,102,0.3); }
}
@keyframes blink {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ── Top Bar ── */
#top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(10,0,8,0.9) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.5s;
}

#top-bar.visible { opacity: 1; }

#top-bar .logo {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--reze-pink);
  text-shadow: 0 0 10px var(--reze-pink);
}

#top-bar .clip-info {
  font-size: 0.8rem;
  color: var(--text-dim);
}

#effect-buttons {
  display: flex;
  gap: 8px;
}

.fx-btn {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  color: var(--text-primary);
  padding: 6px 14px;
  border-radius: 4px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  transition: all 0.2s;
}

.fx-btn:hover, .fx-btn.active {
  background: rgba(255, 51, 102, 0.2);
  border-color: var(--reze-pink);
  color: var(--reze-pink);
  box-shadow: 0 0 15px rgba(255, 51, 102, 0.3);
}

/* ── Video Panels ── */
#video-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  pointer-events: none;
}

.video-panel {
  position: absolute;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255, 51, 102, 0.15);
  opacity: 0;
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: auto;
}

.video-panel video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.video-panel .panel-label {
  position: absolute;
  bottom: 8px; left: 10px;
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  color: var(--reze-gold);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  opacity: 0.7;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}

/* ── Lyrics Display ── */
#lyrics-container {
  position: absolute;
  bottom: 140px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  width: 90%;
  max-width: 800px;
  z-index: 20;
  pointer-events: none;
}

#lyrics-line {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(1.2rem, 3vw, 2rem);
  font-weight: 600;
  color: var(--spark-white);
  text-shadow:
    0 0 20px var(--reze-pink),
    0 0 40px rgba(255, 51, 102, 0.4);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  line-height: 1.4;
}

#lyrics-line.visible {
  opacity: 1;
  transform: translateY(0);
}

#lyrics-line-ar {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: clamp(1rem, 2.5vw, 1.6rem);
  color: var(--reze-gold);
  direction: rtl;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.4s ease 0.15s;
  text-shadow: 0 0 15px rgba(255, 170, 51, 0.4);
}

#lyrics-line-ar.visible { opacity: 0.85; }

/* ── Timeline ── */
#timeline-panel {
  padding: 0 20px 16px;
  background: linear-gradient(0deg, rgba(10,0,8,0.95) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.5s;
}

#timeline-panel.visible { opacity: 1; }

#timeline-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

#play-btn {
  width: 36px; height: 36px;
  background: var(--reze-pink);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
  transition: all 0.2s;
  flex-shrink: 0;
}

#play-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
}

#play-btn svg { fill: white; width: 14px; height: 14px; }

#time-display {
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  color: var(--reze-gold);
  min-width: 90px;
}

#timeline-bar {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: visible;
}

#timeline-progress {
  height: 100%;
  background: linear-gradient(90deg, var(--reze-pink), var(--fuse-orange));
  border-radius: 3px;
  width: 0%;
  position: relative;
  transition: width 0.1s linear;
}

#timeline-progress::after {
  content: '';
  position: absolute;
  right: -5px; top: -4px;
  width: 14px; height: 14px;
  background: var(--reze-pink);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--reze-pink);
}

#volume-control {
  display: flex;
  align-items: center;
  gap: 6px;
}

#volume-slider {
  width: 60px;
  accent-color: var(--reze-pink);
}

/* ── Track Lanes ── */
#track-lanes {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.track-lane {
  display: flex;
  align-items: center;
  height: 22px;
  gap: 8px;
}

.track-lane .lane-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.55rem;
  color: var(--text-dim);
  width: 70px;
  text-align: right;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}

.track-lane .lane-bar {
  flex: 1;
  height: 100%;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}

.lane-segment {
  position: absolute;
  height: 100%;
  border-radius: 2px;
  opacity: 0.6;
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-size: 0.5rem;
  color: rgba(255,255,255,0.7);
  font-family: 'Rajdhani', sans-serif;
  white-space: nowrap;
  overflow: hidden;
}

/* ── Particle Canvas ── */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 5;
  pointer-events: none;
}

/* ── Scanline overlay ── */
#scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 8;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
}

/* ── Flash overlay ── */
#flash-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 30;
  pointer-events: none;
  background: white;
  opacity: 0;
  transition: opacity 0.05s;
}

/* ── Vignette ── */
#vignette {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 7;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(10,0,8,0.7) 100%);
}

/* ── Loading ── */
#loader {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 200;
  background: var(--reze-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s;
}

#loader.done {
  opacity: 0;
  pointer-events: none;
}

#loader .fuse-line {
  width: 200px;
  height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 20px;
}

#loader .fuse-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--reze-pink), var(--fuse-orange), var(--explosion-yellow));
  border-radius: 2px;
  transition: width 0.3s;
  box-shadow: 0 0 10px var(--fuse-orange);
}

#loader .load-text {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 12px;
  letter-spacing: 0.3em;
}

@media (max-width: 768px) {
  #effect-buttons { display: none; }
  .video-panel { border-radius: 4px; }
  #timeline-panel { padding: 0 10px 10px; }
  #volume-control { display: none; }
  .track-lane .lane-label { width: 50px; font-size: 0.5rem; }
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loader">

<!-- Main Overlay -->

      </video>

    </div>

  <!-- Lyrics -->
  <div id="lyrics-container">

  <!-- Timeline -->
  <div id="timeline-panel">

      </div>

    <div id="track-lanes">
      <div class="track-lane">

      </div>
      <div class="track-lane">
        <span class="lane-label">VIDEO B</span>

      </div>
      <div class="track-lane">
        <span class="lane-label">VIDEO C</span>

      <div class="track-lane">

        <span class="lane-label">FX</span>

    </div>
  </div>
</div>

<!-- Audio element for BGM -->
<audio id="bgm" preload="auto" loop>

  };

  const panels = {
    main: document.getElementById('panel-main'),
    voice: document.getElementById('panel-voice'),
    church: document.getElementById('panel-church'),
  };

  // ── THREE.JS Setup ──
  let renderer, scene, camera, planeMesh, clock;
  let shaderUniforms;

  function initThree() {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    clock = new THREE.Clock();

    shaderUniforms = {
      uTime: { value: 0.0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uGlitch: { value: 0.0 },
      uBloom: { value: 0.0 },
      uChroma: { value: 0.0 },
      uInvert: { value: 0.0 },
      uBeat: { value: 0.0 },
      uExplosion: { value: 0.0 },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    };

    const vertShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragShader = `
      precision highp float;
      varying vec2 vUv;

      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uGlitch;
      uniform float uBloom;
      uniform float uChroma;
      uniform float uInvert;
      uniform float uBeat;
      uniform float uExplosion;
      uniform vec2 uMouse;

      #define PI 3.14159265359

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        vec2 shift = vec2(100.0);
        mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p = rot * p * 2.0 + shift;
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv = vUv;
        vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);

        // Glitch distortion
        if (uGlitch > 0.01) {
          float g = uGlitch;
          float scanline = step(0.99 - g * 0.2, hash(vec2(floor(uv.y * 40.0), floor(uTime * 20.0))));
          uv.x += scanline * g * 0.08 * (hash(vec2(uTime * 100.0, uv.y)) - 0.5);
          uv.y += step(0.995, hash(vec2(uTime * 50.0, 0.0))) * g * 0.02;
        }

        vec2 p = (uv - 0.5) * aspect;

        // Flowing nebula background
        float t = uTime * 0.15;
        float n1 = fbm(p * 3.0 + vec2(t, t * 0.7));
        float n2 = fbm(p * 2.0 - vec2(t * 0.5, t * 0.3) + n1 * 0.5);
        float n3 = fbm(p * 4.0 + vec2(n2 * 0.3, t * 0.2));

        // Reze colors: deep dark pink/crimson nebula
        vec3 col1 = vec3(0.15, 0.0, 0.05);   // deep dark
        vec3 col2 = vec3(0.5, 0.02, 0.15);    // dark crimson
        vec3 col3 = vec3(1.0, 0.2, 0.4);      // reze pink
        vec3 col4 = vec3(1.0, 0.6, 0.1);      // fuse orange
        vec3 col5 = vec3(1.0, 0.85, 0.2);     // explosion yellow

        vec3 color = mix(col1, col2, smoothstep(0.2, 0.6, n1));
        color = mix(color, col3, smoothstep(0.5, 0.8, n2) * 0.4);
        color = mix(color, col4, smoothstep(0.6, 0.9, n3) * 0.2);

        // Beat pulse
        float beatPulse = uBeat * 0.3;
        color += col3 * beatPulse * smoothstep(0.4, 0.0, length(p - (uMouse - 0.5) * aspect));

        // Explosion flash
        if (uExplosion > 0.01) {
          float dist = length(p);
          float ring = smoothstep(uExplosion * 2.0, uExplosion * 2.0 - 0.3, dist);
          ring *= smoothstep(0.0, 0.1, uExplosion);
          color += mix(col5, col3, dist) * ring * uExplosion * 3.0;

          // Shockwave ring
          float shockDist = abs(dist - uExplosion * 1.5);
          float shock = smoothstep(0.05, 0.0, shockDist) * uExplosion;
          color += vec3(1.0, 0.8, 0.4) * shock * 2.0;
        }

        // Chromatic aberration
        if (uChroma > 0.01) {
          float ca = uChroma * 0.015;
          vec2 dir = normalize(uv - 0.5);
          float d = length(uv - 0.5);
          color.r = mix(color.r, color.r * 1.2, d * ca * 10.0);
          color.b = mix(color.b, color.b * 1.2, d * ca * 10.0);
        }

        // Bloom glow
        color += color * uBloom * 0.5;

        // Fuse sparks / fireflies
        for (int i = 0; i < 6; i++) {
          float fi = float(i);
          vec2 sparkPos = vec2(
            sin(t * (1.0 + fi * 0.3) + fi * 2.0) * 0.3,
            cos(t * (0.8 + fi * 0.2) + fi * 1.5) * 0.2
          );
          float sparkDist = length(p - sparkPos);
          float spark = smoothstep(0.02 + uBeat * 0.01, 0.0, sparkDist);
          color += mix(col4, col5, sin(uTime + fi)) * spark * 0.5;
        }

        // Invert
        color = mix(color, 1.0 - color, uInvert);

        // Vignette
        float vig = 1.0 - smoothstep(0.3, 1.2, length(p));
        color *= vig;

        // Subtle grain
        color += (hash(uv * uTime * 100.0) - 0.5) * 0.03;

        gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
      }
    `;

    const geo = new THREE.PlaneGeometry(2, 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: shaderUniforms,
      vertexShader: vertShader,
      fragmentShader: fragShader,
    });
    planeMesh = new THREE.Mesh(geo, mat);
    scene.add(planeMesh);
  }

  // ── Particle System ──
  const particles = [];
  const MAX_PARTICLES = 200;

  function spawnParticle(x, y, type) {
    if (particles.length >= MAX_PARTICLES) return;
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed * (type === 'explosion' ? 3 : 1),
      vy: Math.sin(angle) * speed * (type === 'explosion' ? 3 : 1) - (type === 'spark' ? 2 : 0),
      life: 1.0,
      decay: 0.005 + Math.random() * 0.02,
      size: type === 'explosion' ? 3 + Math.random() * 4 : 1 + Math.random() * 2,
      type,
      hue: type === 'spark' ? 20 + Math.random() * 20 : 340 + Math.random() * 30,
    });
  }

  function updateParticles(dt) {
    const w = particleCanvas.width;
    const h = particleCanvas.height;
    pCtx.clearRect(0, 0, w, h);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      const alpha = p.life * 0.8;
      const glow = p.size * 2;
      pCtx.save();
      pCtx.globalAlpha = alpha;
      pCtx.shadowColor = `hsla(${p.hue}, 100%, 60%, ${alpha})`;
      pCtx.shadowBlur = glow;
      pCtx.fillStyle = `hsla(${p.hue}, 100%, ${50 + p.life * 30}%, ${alpha})`;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      pCtx.fill();
      pCtx.restore();
    }
  }

  function burstParticles(cx, cy, count, type) {
    for (let i = 0; i < count; i++) {
      spawnParticle(cx, cy, type);
    }
  }

  // ── Ambient spark emitter ──
  function ambientSparks() {
    if (!isPlaying) return;
    const x = Math.random() * particleCanvas.width;
    const y = particleCanvas.height * 0.7 + Math.random() * particleCanvas.height * 0.3;
    spawnParticle(x, y, 'spark');
  }

  // ── Lyrics Engine ──
  let currentLyricIdx = -1;

  function updateLyrics(t) {
    let idx = -1;
    for (let i = LYRICS.length - 1; i >= 0; i--) {
      if (t >= LYRICS[i].t) { idx = i; break; }
    }
    if (idx !== currentLyricIdx) {
      currentLyricIdx = idx;
      if (idx >= 0 && LYRICS[idx].en) {
        lyricsLine.textContent = LYRICS[idx].en;
        lyricsLineAr.textContent = LYRICS[idx].ar;
        lyricsLine.classList.add('visible');
        lyricsLineAr.classList.add('visible');
      } else {
        lyricsLine.classList.remove('visible');
        lyricsLineAr.classList.remove('visible');
      }
    }
  }

  // ── Timeline Track Lane Segments ──
  function buildTrackLanes() {
    const lanes = {
      'lane-main': [
        { start: 0, end: 100, color: 'var(--reze-pink)', label: 'Reze Explosion' },
      ],
      'lane-voice': [
        { start: 5, end: 85, color: 'var(--reze-glow)', label: 'Voice Clip' },
      ],
      'lane-church': [
        { start: 10, end: 95, color: 'var(--reze-gold)', label: 'Church Arc' },
      ],
      'lane-lyrics': LYRICS.filter(l => l.en).map((l, i, arr) => ({
        start: (l.t / duration) * 100,
        end: (((arr[i + 1] ? arr[i + 1].t : l.t + 4)) / duration) * 100,
        color: 'var(--fuse-orange)',
        label: l.en.substring(0, 20) + '...',
      })),
      'lane-fx': [
        { start: 18, end: 25, color: '#ff3366', label: 'GLITCH' },
        { start: 35, end: 42, color: '#ff6600', label: 'BLOOM' },
        { start: 52, end: 58, color: '#9933ff', label: 'CHROMA' },
        { start: 68, end: 75, color: '#ffdd00', label: 'EXPLOSION' },
        { start: 85, end: 95, color: '#ff3366', label: 'FINALE' },
      ],
    };

    for (const [id, segs] of Object.entries(lanes)) {
      const el = document.getElementById(id);
      if (!el) continue;
      segs.forEach(s => {
        const seg = document.createElement('div');
        seg.className = 'lane-segment';
        seg.style.left = s.start + '%';
        seg.style.width = Math.max(0.5, s.end - s.start) + '%';
        seg.style.background = s.color;
        seg.textContent = s.label || '';
        el.appendChild(seg);
      });
    }
  }

  // ── Scheduled FX Events ──
  const FX_EVENTS = [
    { t: 18, type: 'glitch', dur: 4 },
    { t: 27, type: 'explosion', dur: 2 },
    { t: 35, type: 'bloom', dur: 5 },
    { t: 48, type: 'glitch', dur: 3 },
    { t: 53, type: 'chroma', dur: 4 },
    { t: 61, type: 'explosion', dur: 2 },
    { t: 65, type: 'glitch', dur: 2 },
    { t: 70, type: 'bloom', dur: 4 },
    { t: 78, type: 'explosion', dur: 3 },
    { t: 87, type: 'chroma', dur: 5 },
    { t: 95, type: 'explosion', dur: 3 },
    { t: 99, type: 'glitch', dur: 4 },
    { t: 104, type: 'bloom', dur: 6 },
  ];

  function processAutoFX(t) {
    FX_EVENTS.forEach(ev => {
      const dt = t - ev.t;
      if (dt >= 0 && dt < ev.dur) {
        const progress = dt / ev.dur;
        const envelope = Math.sin(progress * Math.PI);
        switch (ev.type) {
          case 'glitch':
            glitchAmount = Math.max(glitchAmount, envelope);
            break;
          case 'bloom':
            bloomStrength = Math.max(bloomStrength, envelope * 0.8);
            break;
          case 'chroma':
            chromaShift = Math.max(chromaShift, envelope);
            break;
          case 'explosion':
            shaderUniforms.uExplosion.value = Math.max(shaderUniforms.uExplosion.value, envelope);
            if (dt < 0.15) {
              flashOverlay.style.opacity = (1 - dt / 0.15) * 0.6;
              burstParticles(
                particleCanvas.width / 2 + (Math.random() - 0.5) * 200,
                particleCanvas.height / 2,
                15,
                'explosion'
              );
            }
            break;
        }
      }
    });
  }

  // ── Layout ──
  const LAYOUTS = [
    // Layout 0: main center large, voice top-right, church bottom-left
    (w, h) => ({
      main: { left: '20%', top: '12%', width: '60%', height: '58%' },
      voice: { right: '3%', top: '8%', left: 'auto', width: '22%', height: '28%' },
      church: { left: '3%', bottom: '18%', top: 'auto', width: '22%', height: '28%' },
    }),
    // Layout 1: split screen
    (w, h) => ({
      main: { left: '2%', top: '10%', width: '48%', height: '55%' },
      voice: { left: '52%', top: '10%', width: '46%', height: '27%' },
      church: { left: '52%', top: '40%', width: '46%', height: '27%' },
    }),
    // Layout 2: cinematic widescreen main
    (w, h) => ({
      main: { left: '5%', top: '15%', width: '90%', height: '50%' },
      voice: { left: '5%', top: '5%', width: '18%', height: '12%' },
      church: { right: '5%', top: '5%', left: 'auto', width: '18%', height: '12%' },
    }),
  ];

  let currentLayout = 0;

  function applyLayout(idx) {
    const l = LAYOUTS[idx](window.innerWidth, window.innerHeight);
    for (const [key, styles] of Object.entries(l)) {
      const el = panels[key];
      el.style.cssText = '';
      el.style.position = 'absolute';
      for (const [prop, val] of Object.entries(styles)) {
        el.style[prop] = val;
      }
      el.style.opacity = '1';
      el.style.borderRadius = '8px';
      el.style.border = '1px solid var(--panel-border)';
      el.style.overflow = 'hidden';
      el.style.boxShadow = '0 0 30px rgba(255, 51, 102, 0.15)';
      el.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
    }
  }

  // ── Beat System ──
  let beatPhase = 0;
  const BPM = 128;
  const BEAT_INTERVAL = 60 / BPM;

  function getBeat(t) {
    const beatPos = (t % BEAT_INTERVAL) / BEAT_INTERVAL;
    return Math.pow(Math.max(0, 1 - beatPos * 4), 2);
  }

  // ── Camera Shake ──
  function applyShake() {
    if (shakeIntensity < 0.01) {
      document.getElementById('overlay').style.transform = '';
      return;
    }
    const x = (Math.random() - 0.5) * shakeIntensity * 20;
    const y = (Math.random() - 0.5) * shakeIntensity * 20;
    document.getElementById('overlay').style.transform = `translate(${x}px, ${y}px)`;
  }

  // ── Time Formatting ──
  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  // ── FPS Counter ──
  let frameCount = 0;
  let lastFpsTime = 0;

  // ── Main Loop ──
  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    const dt = clock.getDelta();

    // FPS
    frameCount++;
    if (elapsed - lastFpsTime >= 1) {
      fpsCounter.textContent = frameCount + ' FPS';
      frameCount = 0;
      lastFpsTime = elapsed;
    }

    if (isPlaying) {
      currentTime = bgm.currentTime || 0;
      duration = bgm.duration || 120;

      // Progress bar
      const pct = (currentTime / duration) * 100;
      progressBar.style.width = pct + '%';
      timeDisplay.textContent = `${fmt(currentTime)} / ${fmt(duration)}`;

      // Lyrics
      updateLyrics(currentTime);

      // Auto FX
      processAutoFX(currentTime);

      // Layout switching
      const newLayout = Math.floor(currentTime / 30) % LAYOUTS.length;
      if (newLayout !== currentLayout) {
        currentLayout = newLayout;
        applyLayout(currentLayout);
      }

      // Ambient sparks
      if (Math.random() < 0.3) ambientSparks();
    }

    // Beat
    const beat = isPlaying ? getBeat(currentTime) : 0;

    // Decay manual effects
    if (!activeEffects.has('glitch')) glitchAmount *= 0.95;
    if (!activeEffects.has('bloom')) bloomStrength *= 0.97;
    if (!activeEffects.has('chroma')) chromaShift *= 0.96;
    if (!activeEffects.has('shake')) shakeIntensity *= 0.92;
    if (!activeEffects.has('invert')) invertAmount *= 0.95;

    // Update uniforms
    shaderUniforms.uTime.value = elapsed;
    shaderUniforms.uGlitch.value = glitchAmount;
    shaderUniforms.uBloom.value = bloomStrength + beat * 0.2;
    shaderUniforms.uChroma.value = chromaShift;
    shaderUniforms.uInvert.value = invertAmount;
    shaderUniforms.uBeat.value = beat;
    shaderUniforms.uExplosion.value *= 0.97;

    // Flash decay
    const flashOpacity = parseFloat(flashOverlay.style.opacity || 0);
    if (flashOpacity > 0.01) {
      flashOverlay.style.opacity = flashOpacity * 0.9;
    }

    // Shake
    applyShake();

    // Video playback rate
    const rate = slowMo ? 0.3 : 1.0;
    Object.values(videos).forEach(v => {
      if (v.playbackRate !== rate) v.playbackRate = rate;
    });

    // Video panel glow on beat
    if (beat > 0.3) {
      panels.main.style.boxShadow = `0 0 ${30 + beat * 40}px rgba(255, 51, 102, ${0.15 + beat * 0.3})`;
    }

    // Render Three.js
    renderer.render(scene, camera);

    // Particles
    updateParticles(dt);
  }

  // ── Event Handlers ──
  function startExperience() {
    titleCard.classList.add('hidden');
    topBar.classList.add('visible');
    timelinePanel.classList.add('visible');
    applyLayout(0);

    bgm.volume = volumeSlider.value / 100;
    bgm.play().catch(() => {});
    Object.values(videos).forEach(v => v.play().catch(() => {}));
    isPlaying = true;

    playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  }

  titleCard.addEventListener('click', startExperience);

  playBtn.addEventListener('click', () => {
    if (!titleCard.classList.contains('hidden')) {
      startExperience();
      return;
    }

    isPlaying = !isPlaying;
    if (isPlaying) {
      bgm.play().catch(() => {});
      Object.values(videos).forEach(v => v.play().catch(() => {}));
      playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    } else {
      bgm.pause();
      Object.values(videos).forEach(v => v.pause());
      playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
    }
  });

  timelineBar.addEventListener('click', (e) => {
    const rect = timelineBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const seekTime = pct * duration;
    bgm.currentTime = seekTime;
    Object.values(videos).forEach(v => { v.currentTime = seekTime % (v.duration || 999); });
  });

  volumeSlider.addEventListener('input', () => {
    bgm.volume = volumeSlider.value / 100;
  });

  // Effect buttons
  document.querySelectorAll('.fx-btn').forEach(btn => {
    const fx = btn.dataset.fx;

    btn.addEventListener('mousedown', () => {
      activeEffects.add(fx);
      btn.classList.add('active');
      switch (fx) {
        case 'glitch': glitchAmount = 1; break;
        case 'bloom': bloomStrength = 1; break;
        case 'chroma': chromaShift = 1; break;
        case 'shake': shakeIntensity = 1; break;
        case 'invert': invertAmount = 1; break;
        case 'slowmo': slowMo = true; break;
      }
      if (fx === 'shake' || fx === 'glitch') {
        burstParticles(
          particleCanvas.width / 2 + (Math.random() - 0.5) * 300,
          particleCanvas.height / 2 + (Math.random() - 0.5) * 200,
          20, 'explosion'
        );
      }
    });

    btn.addEventListener('mouseup', () => {
      activeEffects.delete(fx);
      btn.classList.remove('active');
      if (fx === 'slowmo') slowMo = false;
    });

    btn.addEventListener('mouseleave', () => {
      activeEffects.delete(fx);
      btn.classList.remove('active');
      if (fx === 'slowmo') slowMo = false;
    });
  });

  // Mouse tracking for shader
  window.addEventListener('mousemove', (e) => {
    shaderUniforms.uMouse.value.set(e.clientX / window.innerWidth, 1 - e.clientY / window.innerHeight);
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case ' ':
        e.preventDefault();
        playBtn.click();
        break;
      case 'g': glitchAmount = 1; setTimeout(() => glitchAmount *= 0.5, 200); break;
      case 'b': bloomStrength = 1; break;
      case 'c': chromaShift = 1; break;
      case 's': shakeIntensity = 1; break;
      case 'i': invertAmount = 1; break;
      case 'e':
        shaderUniforms.uExplosion.value = 1;
        flashOverlay.style.opacity = '0.5';
        burstParticles(particleCanvas.width / 2, particleCanvas.height / 2, 40, 'explosion');
        break;
      case '1': applyLayout(0); currentLayout = 0; break;
      case '2': applyLayout(1); currentLayout = 1; break;
      case '3': applyLayout(2); currentLayout = 2; break;
    }
  });

  // Resize
  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    shaderUniforms.uResolution.value.set(w, h);
    particleCanvas.width = w;
    particleCanvas.height = h;
  }
  window.addEventListener('resize', onResize);

  // ── Init ──
  function init() {
    particleCanvas.width = window.innerWidth;
    particleCanvas.height = window.innerHeight;

    initThree();
    buildTrackLanes();

    // Simulate loading
    let loadProgress = 0;
    const loadInterval = setInterval(() => {
      loadProgress += 5 + Math.random() * 10;
      if (loadProgress >= 100) {
        loadProgress = 100;
        clearInterval(loadInterval);
        setTimeout(() => {
          document.getElementById('loader').classList.add('done');
        }, 400);
      }
      fuseFill.style.width = loadProgress + '%';
    }, 150);

    // Start animation loop
    animate();
  }

  // Wait for DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
